    <script>
      // Suppress Vite HMR WebSocket connection closed warnings in iframe/sandboxed environments
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String(a && a.message ? a.message : a); }).join(' ');
          if (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('vite:ws') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String(a && a.message ? a.message : a); }).join(' ');
          if (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('@vite/client') !== -1
          ) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && event.error.message)) ? String(event.message || event.error.message) : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('@vite/client') !== -1
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason ? String(event.reason.message || event.reason) : '';
          if (
            reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('closed without opened') !== -1 ||
            reason.indexOf('@vite/client') !== -1
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
              var listeners = {};
              var mockSocket = {
                url: url,
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {
                  mockSocket.readyState = 3;
                },
                addEventListener: function(event, callback) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(callback);
                  if (event === 'open') {
                    setTimeout(function() {
                      try {
                        callback({ type: 'open', target: mockSocket });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, callback) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(function(cb) { return cb !== callback; });
                },
                dispatchEvent: function() { return true; }
              };
              return mockSocket;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>
